version: '3.8'
services:
  backend:
    build: ./Team_Namoo_server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
  frontend:
    build: ./Team_Namoo_Front
    ports:
      - "5173:5173"
    volumes:
      - ./Team_Namoo_Front:/app
      - /app/node_modules
    depends_on:
      - backend