# 프론트엔드(React + Vite) 로컬 개발 환경
#
#   cd Team_Namoo_Front && docker compose up
#
# Node/npm 을 호스트에 설치할 필요 없음. 컨테이너가 기동할 때마다
#   npm install  →  vite dev 서버(--host)
# 를 실행한다. 소스는 바인드 마운트라 저장하면 HMR 로 즉시 반영되고,
# node_modules 는 named volume 이라 호스트 폴더와 섞이지 않고 재기동해도 유지된다.
# (예전 방식: Dockerfile + 익명 볼륨 → npm 패키지가 안 깔리거나 stale 해지는 문제 → 이 방식으로 교체)
#
# 접속: http://localhost:5173

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # 백엔드 주소.
      #  - 서버를 호스트에서 직접 실행(gradlew bootRun 또는 Team_Namoo_server compose): 아래 기본값
      #  - 루트 docker-compose.yml 로 같이 띄울 때는 루트 파일이 http://localhost:8080 로 넣어줌
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
