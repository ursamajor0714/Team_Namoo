spring.application.name=Team_Navigation_server

# 실제 키 값은 application-local.properties(git 미추적)에 둔다
spring.config.import=optional:classpath:application-local.properties

# NAVER API HUB 뉴스 검색 API (NAVER Cloud Platform > NAVER API HUB 콘솔의 "인증 정보"에서 발급)
# client-id = X-NCP-APIGW-API-KEY-ID, client-secret = X-NCP-APIGW-API-KEY
naver.client-id=2eygq1f1bc
naver.client-secret=F71oK5wlshaQPK0i0Xzx3opbQLWRYNxhHr2ZqhFN

# 수집한 기사(JSON/CSV) 저장 경로 - 콜랩에서 이 경로에 생성된 파일을 업로드해서 사용한다.
news.export.dir=news-export

# OpenAI API 키 (https://platform.openai.com/api-keys 에서 발급) - 기사 본문 요약에 사용
# 값이 비어있으면 요약 없이 title/content만 수집한다.
openai.api-key=YOUR_OPENAI_API_KEY
openai.model=gpt-4o-mini

# Claude API 키 (https://console.anthropic.com/settings/keys 에서 발급) - 정치성향 분류 테스트용
# 실제 값은 application-local.properties에 넣는다 (git에 안 올라감)
claude.api-key=YOUR_CLAUDE_API_KEY
claude.model=claude-sonnet-4-5

# 로컬 FastAPI 분류 서버 (classification-api/main.py, uvicorn main:app --port 8000)
classification.model.base-url=http://localhost:8000
