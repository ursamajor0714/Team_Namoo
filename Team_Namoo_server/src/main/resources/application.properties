spring.application.name=Team_Navigation_server

# 실제 키 값은 application-local.properties(git 미추적)에 둔다
spring.config.import=optional:classpath:application-local.properties

# NAVER 뉴스 검색 API - 키 값은 커밋하지 않는다.
# 로컬: application-local.properties 에 naver.client-id / naver.client-secret 을 넣는다.
# 배포: 환경변수 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 로 주입한다.
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}

# 수집한 기사(JSON/CSV) 저장 경로 - 콜랩에서 이 경로에 생성된 파일을 업로드해서 사용한다.
news.export.dir=news-export

# 로컬 FastAPI 분류 서버 (classification-api/main.py, uvicorn main:app --port 8000)
# 배포: 환경변수 CLASSIFICATION_MODEL_BASE_URL 로 팀원 분류 서버 주소를 주입한다.
classification.model.base-url=${CLASSIFICATION_MODEL_BASE_URL:http://localhost:8000}

# SNS 로그인 (구글/네이버). client-secret은 커밋하지 않는다.
# 로컬: application-local.properties. 배포: 환경변수(GOOGLE_CLIENT_ID 등).
# redirect-uri는 프론트의 콜백 페이지 주소 - 구글/네이버 개발자 콘솔에 등록한 값과 정확히 일치해야 한다.
# naver.client-id(뉴스검색용)와는 별개의 네이버 애플리케이션(네이버 로그인)을 새로 등록해야 한다.
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google/callback}
oauth.naver.client-id=${NAVER_LOGIN_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET:}
oauth.naver.redirect-uri=${NAVER_LOGIN_REDIRECT_URI:http://localhost:5173/oauth/naver/callback}

# 광고 이미지 업로드용 S3 버킷 (ADMIN_CONSOLE_BACKEND_TODO 4-3). 자격증명은 코드/설정에 넣지 않고
# 기본 체인(로컬: 환경변수 AWS_ACCESS_KEY_ID/SECRET, 배포: EC2 인스턴스 롤)을 그대로 쓴다.
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:ap-northeast-2}
# CloudFront 붙이기 전까지는 비워두면 S3 버킷 URL을 그대로 imageUrl로 반환한다.
aws.s3.cloudfront-domain=${AWS_CLOUDFRONT_DOMAIN:}

# 이메일 인증용 Gmail SMTP (구글 계정 > 보안 > 2단계 인증 > 앱 비밀번호 에서 발급)
# 실제 값은 application-local.properties에 넣는다 (git에 안 올라감)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.defer-datasource-initialization=true

spring.datasource.url=jdbc:h2:mem:2d549153-f17a-4256-96e6-03f3f99769c7
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
